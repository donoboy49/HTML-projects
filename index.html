<!DOCTYPE html>
<html>
  <body>
    <script>
      fetch("https://cdn.jsdelivr.net/gh/rosinxsosa/rosin@main/index.html?t=" + Date.now())
        .then(r => r.text())
        .then(html => {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(err => console.error(err));
    </script>
  </body>
</html>
